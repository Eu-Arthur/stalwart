name: Build Stalwart FoundationDB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  packages: write

env:
  IMAGE_REPO: stalwart-foundationdb
  FDB_VERSION_RANGE: "7.4"

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save custom Dockerfile
        run: |
          cp Dockerfile.fdb /tmp/Dockerfile.fdb

      - name: Add upstream and fetch tags
        run: |
          git remote add upstream https://github.com/stalwartlabs/stalwart.git || true
          git fetch upstream --tags

      - name: Checkout latest upstream tag
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No upstream tag found"
            exit 1
          fi

          echo "Latest upstream tag: $LATEST_TAG"
          git checkout -B build-foundationdb "$LATEST_TAG"

          echo "version=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Restore custom Dockerfile
        run: |
          cp /tmp/Dockerfile.fdb ./Dockerfile.fdb

      - name: Build lowercase image env
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/${IMAGE_REPO}" >> "$GITHUB_ENV"

      - name: Show build variables
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME}"
          echo "FDB_VERSION_RANGE=${FDB_VERSION_RANGE}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: image-check
        run: |
          IMAGE="${IMAGE_NAME}:${{ steps.version.outputs.version }}-fdb"

          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: $IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet: $IMAGE"
          fi

      - name: Build and push multi-arch image
        if: steps.image-check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fdb
          platforms: linux/amd64
          push: true
          build-args: |
            FDB_VERSION_RANGE=${{ env.FDB_VERSION_RANGE }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-fdb
            ${{ env.IMAGE_NAME }}:latest
